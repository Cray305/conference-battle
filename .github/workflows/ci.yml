name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      # Pull requests from forks can't read the API key, so bundle the page
      # around a placeholder instead of real game data.
      - name: Bundle
        run: |
          mkdir -p src/generated
          echo '{}' > src/generated/games.json
          bun run bundle
